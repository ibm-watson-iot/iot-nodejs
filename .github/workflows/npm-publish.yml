# This workflow will build using Node and then publish a package to NPM when code is pushed to master
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to npm

on:
  push:
    branches:
      - "master"
      - MASMON-6940-enable-OIDC-v2

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    # Required permissions for publishing with provenance
    permissions:
      contents: read
      id-token: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      
      - run: npm i
      - run: npm run build

      # Publish to npm with provenance and public access
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}} 